name: 功能建议
description: 想要新的能力或改现有行为
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先看 [已知限制](https://github.com/glowwan/markplay#已知限制) 和 [REVIEW.md 的路线图](https://github.com/glowwan/markplay/blob/main/REVIEW.md)。
        有些限制是 `--wid` 原生子窗口的固有问题（比如控制条不能悬浮在画面上），不是遗漏。

  - type: textarea
    id: problem
    attributes:
      label: 你在做什么的时候遇到了麻烦
      description: 描述场景，而不是直接说"加个 XX 功能"。场景比方案更能帮我判断该怎么做。
      placeholder: |
        我经常一次处理十几个短片，每个片子里挑 5–8 个片段。
        现在打完点要手动一个个建区间，很重复……
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望怎么解决
      description: 有具体想法就写，没有也行
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在是怎么绕过去的
      description: 比如用别的软件、脚本、手动操作
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关环节
      multiple: true
      options:
        - 播放 / 解码
        - 触摸板刷片手感
        - 打点 / 标记
        - 区间
        - 导出格式
        - 剪辑
        - 字幕
        - 界面布局
        - 其它

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我搜索过 Issues，没有重复建议
          required: true
