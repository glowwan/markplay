<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MarkPlay 悬浮控件</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<!-- 悬浮控件条：默认隐藏，鼠标靠近视频区域时淡入 -->
<div id="pill" class="pill" role="toolbar" aria-label="播放控制">
  <button id="ov-play" class="ov-btn" title="播放 / 暂停 (Space)">▶</button>

  <span id="ov-time" class="ov-time">--:--:--</span>

  <div id="ov-bar" class="ov-bar" title="点击或拖拽跳转">
    <div id="ov-fill" class="ov-fill"></div>
    <div id="ov-knob" class="ov-knob"></div>
  </div>

  <span id="ov-total" class="ov-time muted">--:--:--</span>

  <button id="ov-mute" class="ov-btn" title="静音">🔊</button>
  <input id="ov-vol" class="ov-vol" type="range" min="0" max="100" step="1" value="100" title="音量">
  <button id="ov-full" class="ov-btn" title="视频全屏 (F11)">⛶</button>
</div>

<script src="overlay.js"></script>
</body>
</html>
