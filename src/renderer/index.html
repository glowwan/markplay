<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.name">MarkPlay 打点播放器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- 拖放提示遮罩：文件拖入窗口时显示 -->
<div id="drop-hint" hidden data-i18n="ui.dropHint">松开鼠标以打开视频</div>
<!-- 加载遮罩：大文件打开时给个反馈，避免以为卡死 -->
<div id="loading" hidden>
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" data-i18n="ui.loading">正在加载…</div>
  </div>
</div>
<!-- 右下角提示（导出完成 / 剪辑完成 / 出错） -->
<div id="toast-stack" aria-live="polite"></div>
<div id="app">
  <!-- 上部：视频区 + 侧栏 -->
  <div id="main">
    <!-- 左：视频区。mpv 画面由主进程嵌入到该区域的原生子窗口中播放，
         HTML 元素无法覆盖在视频画面之上，因此所有 UI 都放在视频区之外 -->
    <div id="video-host">
      <div id="video-placeholder">
        <span data-i18n="ui.openVideoHint">拖拽视频文件到窗口任意处，或按 O 打开</span>
      </div>
    </div>

    <!-- 右：300px 侧栏 -->
    <aside id="sidebar">
      <!-- ① 标记列表 -->
      <section class="panel" id="marker-panel">
        <div class="panel-title"><span data-i18n="ui.markers">标记</span> <span id="marker-count" class="count"></span></div>
        <div class="mark-buttons">
          <button id="btn-mark-a" class="mark-btn color-a" data-i18n="ui.markA" data-i18n-title="ui.markADesc" title="在当前时间打 A 点 (A)">A 打点</button>
          <button id="btn-mark-b" class="mark-btn color-b" data-i18n="ui.markB" data-i18n-title="ui.markBDesc" title="在当前时间打 B 点 (B)">B 打点</button>
          <button id="btn-mark-c" class="mark-btn color-c" data-i18n="ui.markC" data-i18n-title="ui.markCDesc" title="在当前时间打 C 点 (C)">C 打点</button>
          <button id="btn-mark-d" class="mark-btn color-d" data-i18n="ui.markD" data-i18n-title="ui.markDDesc" title="在当前时间打 D 点 (D)">D 打点</button>
          <button id="btn-mark-f" class="mark-btn color-f" data-i18n="ui.markF" data-i18n-title="ui.markFDesc" title="在当前时间打 F 点 (F)">F 打点</button>
          <button id="btn-mark-g" class="mark-btn color-g" data-i18n="ui.markG" data-i18n-title="ui.markGDesc" title="在当前时间打 G 点 (G)">G 打点</button>
        </div>
        <ul id="marker-list" class="marker-list"></ul>
        <div class="hint" data-i18n="ui.markerHint">点击列表项跳转 · 双击标签重命名 · 拖动时间轴刻度改时间 · Ctrl+Z 撤销</div>

        <!-- 批量重命名：内联表单（Electron 不支持 prompt，只能自己画） -->
        <button id="btn-batch-rename" class="btn wide" data-i18n="ui.batchRename" data-i18n-title="ui.batchRenameDesc" title="按前缀 / 后缀 / 时序编号一次改多条标记名">批量重命名…</button>
        <div id="batch-rename-box" hidden>
          <label class="field">
            <span data-i18n="ui.batchScope">范围</span>
            <select id="batch-scope">
              <option value="all" data-i18n="ui.batchScopeAll">全部标记</option>
              <option value="A" data-i18n="ui.batchScopeOnly" data-i18n-params='{"kind":"A"}'>仅 A</option>
              <option value="B" data-i18n="ui.batchScopeOnly" data-i18n-params='{"kind":"B"}'>仅 B</option>
              <option value="C" data-i18n="ui.batchScopeOnly" data-i18n-params='{"kind":"C"}'>仅 C</option>
              <option value="D" data-i18n="ui.batchScopeOnly" data-i18n-params='{"kind":"D"}'>仅 D</option>
              <option value="F" data-i18n="ui.batchScopeOnly" data-i18n-params='{"kind":"F"}'>仅 F</option>
              <option value="G" data-i18n="ui.batchScopeOnly" data-i18n-params='{"kind":"G"}'>仅 G</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="ui.batchPrefix">前缀</span>
            <input type="text" id="batch-prefix" maxlength="20" data-i18n-placeholder="ui.batchPrefixPlaceholder" placeholder="例如 开场-">
          </label>
          <label class="field">
            <span data-i18n="ui.batchSuffix">后缀</span>
            <input type="text" id="batch-suffix" maxlength="20" data-i18n-placeholder="ui.batchSuffixPlaceholder" placeholder="例如 -待定">
          </label>
          <label class="check">
            <input type="checkbox" id="batch-renumber">
            <span data-i18n="ui.batchRenumber">按时间顺序重新编号（A1、A2…）</span>
          </label>
          <div class="hint" id="batch-preview" data-i18n="ui.batchPreview">预览：—</div>
          <div class="range-actions">
            <button id="btn-batch-apply" class="btn primary" data-i18n="ui.batchApply">应用</button>
            <button id="btn-batch-cancel" class="btn" data-i18n="common.cancel">取消</button>
          </div>
        </div>
      </section>

      <!-- ② 区间（显式 in/out，批量剪辑与 EDL 以它为准） -->
      <section class="panel" id="range-panel">
        <div class="panel-title"><span data-i18n="ui.ranges">区间</span> <span id="range-count" class="count"></span></div>
        <div class="range-actions">
          <button id="btn-range-in" class="btn" data-i18n="ui.rangeIn" data-i18n-title="ui.rangeInDesc" title="把当前播放时间设为区间入点（快捷键 [）">设入点</button>
          <button id="btn-range-out" class="btn" data-i18n="ui.rangeOut" data-i18n-title="ui.rangeOutDesc" title="把当前播放时间设为区间出点并创建区间（快捷键 ]）">设出点</button>
        </div>
        <div class="range-actions">
          <button id="btn-range-from-ab" class="btn" data-i18n="ui.rangeFromAB" data-i18n-title="ui.rangeFromABDesc" title="按 A→B 配对生成区间（兼容只打了 A/B 点的老项目）">A/B 配对</button>
          <button id="btn-range-adjacent" class="btn" data-i18n="ui.rangeAdjacent" data-i18n-title="ui.rangeAdjacentDesc" title="按时间相邻两个标记（1-2、3-4…）生成区间，任意类型都行">相邻配对</button>
        </div>
        <div class="hint" id="range-pending" data-i18n="ui.pendingInNone">入点：未设置</div>
        <div class="hint" data-i18n="ui.rangePanelHint">标记类型（A–G）只是参考点；任意时间按 [ / ] 都能建区间，批量剪辑使用所有区间。</div>
        <ul id="range-list" class="marker-list range-list"></ul>
      </section>

      <!-- ③ 剪辑 -->
      <section class="panel" id="clip-panel">
        <div class="panel-title" data-i18n="ui.clip">剪辑</div>
        <label class="field">
          <span data-i18n="ui.clipRange">区间</span>
          <select id="clip-range"></select>
        </label>
        <label class="field">
          <span data-i18n="ui.clipOutputName">输出名</span>
          <input type="text" id="clip-name" data-i18n-placeholder="ui.clipNamePlaceholder" placeholder="留空则自动命名">
        </label>
        <label class="check">
          <input type="checkbox" id="clip-reencode">
          <span data-i18n="ui.clipReencode">重新编码（按源码率，体积接近原文件）</span>
        </label>
        <label class="check">
          <input type="checkbox" id="clip-merge">
          <span data-i18n="ui.clipMerge">合并为一个文件（批量剪辑时，自动按源码率重编码）</span>
        </label>
        <div class="clip-progress-wrap" id="clip-progress-wrap" data-i18n-title="ui.clipProgress" title="剪辑进度">
          <div id="clip-progress-fill"></div>
        </div>
        <button id="btn-clip" class="btn primary wide" data-i18n="ui.clipStart">开始剪辑</button>
        <button id="btn-clip-batch" class="btn wide" data-i18n="ui.clipBatch" data-i18n-title="ui.clipBatchDesc" title="把区间列表里的每一段各导出一个片段到选定文件夹">批量剪辑（按区间）</button>
      </section>

      <!-- ④ 导出 -->
      <section class="panel" id="export-group">
        <div class="panel-title" data-i18n="ui.export">导出</div>
        <div class="export-buttons">
          <button id="btn-export-csv" class="btn" data-i18n-title="ui.exportCsvDesc" title="导出标记为 CSV 时间码表">CSV</button>
          <button id="btn-export-edl" class="btn" data-i18n-title="ui.exportEdlDesc" title="导出为 CMX3600 EDL（有区间时按区间，否则按标记分段）">EDL</button>
          <button id="btn-export-rng" class="btn" data-i18n="ui.exportRange" data-i18n-title="ui.exportRangeDesc" title="导出区间为 CSV（in/out 秒数、时间码、帧号）">区间</button>
          <button id="btn-export-json" class="btn" data-i18n-title="ui.exportJsonDesc" title="导出为 JSON（标记 + 区间）">JSON</button>
        </div>
        <div class="hint" id="fps-label" data-i18n="ui.fpsUnknown">工程帧率：--</div>
      </section>
    </aside>
  </div>

  <!-- 底部：110px 控制条 -->
  <div id="controlbar">
    <div class="controls-row">
      <button id="btn-play" class="icon-btn" data-i18n-title="ui.playDesc" title="播放 / 暂停 (Space)">▶</button>
      <button id="btn-open" class="icon-btn" data-i18n-title="ui.openDesc" title="打开视频文件 (O)">📂</button>
      <button id="btn-playlist" class="icon-btn" data-i18n-title="ui.playlistDesc" title="文件列表（Ctrl+L）：批量打开的视频都在这里">🗂</button>
      <button id="btn-fullscreen" class="icon-btn" data-i18n-title="ui.fullscreenDesc" title="视频全屏 (F11，再按 ESC 退出)">⛶</button>
      <button id="btn-speed-fwd" class="icon-btn speed-btn" data-i18n-title="ui.speedFwdDesc" title="2 倍速正放 / 恢复 (X)；也可在视频画面上点鼠标左键">2x▶</button>
      <button id="btn-speed-rev" class="icon-btn speed-btn" data-i18n-title="ui.speedRevDesc" title="2 倍速倒放 / 恢复 (Z)；也可在视频画面上点鼠标右键">◀2x</button>
      <button id="btn-loop" class="icon-btn speed-btn" data-i18n="ui.loop" data-i18n-title="ui.loopDesc" title="A–B 循环（L）：按剪辑面板选中的区间循环播放">A–B</button>
      <button id="btn-scenes" class="icon-btn speed-btn" data-i18n="ui.scenes" data-i18n-title="ui.scenesDesc" title="识别画面转场，在时间轴上显示提示浮标（只是提示，不会打点）">转场</button>
      <!-- 转场灵敏度：一次扫描收全部分数，滑块即时过滤，不重扫 -->
      <div id="scene-panel" hidden>
        <div class="scene-panel-row">
          <span class="scene-panel-label" data-i18n="ui.scenePanelThreshold">灵敏度</span>
          <input type="range" id="scene-threshold" min="0.02" max="0.9" step="0.02" value="0.4">
          <span id="scene-threshold-value">0.40</span>
        </div>
        <div class="hint" id="scene-threshold-hint" data-i18n="ui.scenePanelNotScanned">还没扫描</div>
        <div class="range-actions">
          <button id="btn-scene-rescan" class="btn" data-i18n="ui.sceneRescan" data-i18n-title="ui.sceneRescanDesc" title="重新扫描（换片或想收更低的分数时才需要）">重新扫描</button>
          <button id="btn-scene-close" class="btn" data-i18n="common.close">关闭</button>
        </div>
      </div>
      <div class="zoom-wrap" data-i18n-title="ui.zoomWrapDesc" title="时间轴缩放：Ctrl+滚轮 / Ctrl+加号减号；Shift+滚轮平移">
        <button id="btn-zoom-out" class="mini-btn" data-i18n="ui.zoomOut" data-i18n-title="ui.zoomOutDesc" title="缩小">−</button>
        <span id="zoom-label" data-i18n="ui.zoomFull">全片</span>
        <button id="btn-zoom-in" class="mini-btn" data-i18n="ui.zoomIn" data-i18n-title="ui.zoomInDesc" title="放大">＋</button>
        <button id="btn-zoom-fit" class="mini-btn" data-i18n="ui.zoomFit" data-i18n-title="ui.zoomFitDesc" title="适配全片 (Ctrl+0)">适配</button>
      </div>
      <button id="btn-lang" class="mini-btn lang-btn" data-i18n-title="ui.langSwitchDesc" title="切换界面语言 / Switch interface language">中/EN</button>
      <div id="time-wrap">
        <span id="time-current">00:00:00.000</span>
        <span class="sep">/</span>
        <span id="time-total">--:--:--</span>
        <!-- scrub 指示 HUD：只能放在 HTML 区，不能覆盖视频 -->
        <span id="scrub-hud" hidden></span>
      </div>
      <div class="vol-wrap" data-i18n-title="ui.volumeDesc" title="音量（触摸板纵滑也可调节）">
        <span class="vol-icon">🔊</span>
        <input type="range" id="volume" min="0" max="100" value="100" step="1">
      </div>
      <div id="status" data-i18n-title="ui.statusDesc" title="状态" data-i18n="ui.ready">就绪</div>
    </div>
    <!-- 时间轴：div 实现。刻度由 markers.js 渲染进 #marker-ticks -->
    <div id="timeline" data-i18n-title="ui.timelineDesc" title="点击或拖拽跳转">
      <div id="scene-bubbles"></div>
      <div id="timeline-track"></div>
      <div id="range-bars"></div>
      <div id="marker-ticks"></div>
      <div id="timeline-playhead"></div>
    </div>
  </div>
</div>

<!-- 脚本顺序：timeline-view → scenes → scrub → markers → ui → export → renderer（主 wiring）；
     config 由 preload 注入为 window.markplay.config，此处不引入 -->
<script src="i18n-apply.js"></script>
<script src="timeline-view.js"></script>
<script src="scenes.js"></script>
<script src="scrub.js"></script>
<script src="markers.js"></script>
<script src="ui.js"></script>
<script src="export.js"></script>
<script src="renderer.js"></script>
</body>
</html>
